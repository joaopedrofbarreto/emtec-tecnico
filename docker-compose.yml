services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: emtec
      POSTGRES_PASSWORD: emtec
      POSTGRES_DB: emtec
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emtec -d emtec"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./database/mongo:/data/db

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://emtec:emtec@postgres:5432/emtec?schema=public
      MONGO_URL: mongodb://mongo:27017/emtec
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend